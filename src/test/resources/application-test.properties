# Perfil de pruebas: base H2 en memoria propia de cada contexto (sin datos de demo),
# BCrypt con costo minimo para que las pruebas sean rapidas y un secreto JWT de prueba.
spring.datasource.url=jdbc:h2:mem:jornal-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
app.security.jwt-secret=secreto-exclusivo-de-las-pruebas-automatizadas-de-jornal
app.security.bcrypt-strength=4
app.seed.enabled=false
spring.thymeleaf.cache=false
logging.level.com.jornal=INFO
