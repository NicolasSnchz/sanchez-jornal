# ============================================================================
# Perfil demo: se suma a otro perfil para presentar la aplicacion.
#   dev + demo  -> igual que dev (dev ya trae datos y Swagger)
#   prod + demo -> PostgreSQL y secretos de prod, mas datos de ejemplo y Swagger UI
# docker compose lo usa por defecto (SPRING_PROFILES_ACTIVE=prod,demo) para que
# la aplicacion no arranque vacia. Para un despliegue real se usa solo prod.
# No toca la base de datos ni los secretos: esos los define el otro perfil.
# ============================================================================
app.seed.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
