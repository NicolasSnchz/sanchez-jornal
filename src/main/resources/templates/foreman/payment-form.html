<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(#{${'pago.tipo.' + form.type}}, ~{::view}, 'page page-narrow')}">
<body>
<th:block th:fragment="view">
    <div class="page-head">
        <div>
            <div class="crumbs">
                <a th:href="@{/maestro/asignaciones/{id}(id=${a.id()})}" th:text="${a.workerName()}">Trabajador</a><span aria-hidden="true">/</span>
                <span th:text="${a.siteName()}">Obra</span>
            </div>
            <h1 th:text="#{${'pago.tipo.' + form.type}}">Liquidar periodo</h1>
            <p class="lede" th:text="#{${'pago.ayuda.' + form.type}}">Explicación del tipo</p>
        </div>
    </div>

    <form class="panel" th:object="${form}" th:action="@{/maestro/asignaciones/{id}/pagos(id=${a.id()})}" method="post" novalidate
          th:attr="data-confirm=${form.type.name() == 'ADVANCE'} ? null : #{pago.confirmar.registro}">
        <input type="hidden" th:field="*{type}">
        <div class="panel-body form">
            <div th:replace="~{fragments/ui :: globalErrors}"></div>

            <!--/* Liquidacion de periodo: el inicio lo fija el sistema; el maestro elige el corte. */-->
            <div class="form-grid" th:if="${form.type.name() == 'SETTLEMENT'}">
                <div class="field">
                    <span class="label" th:text="#{pago.periodo.desde}">Desde</span>
                    <strong th:text="${@fmt.date(a.nextUnsettledDate())}">fecha</strong>
                    <span class="hint" th:text="#{pago.periodo.desde.pista}">Primer día sin liquidar.</span>
                </div>
                <div class="field">
                    <label for="periodEnd" th:text="#{pago.periodo.hasta}">Hasta</label>
                    <div class="cluster">
                        <input type="date" th:field="*{periodEnd}" th:max="${today}">
                        <button class="btn btn-sm" type="submit" th:formaction="@{/maestro/asignaciones/{id}/pagos/calcular(id=${a.id()})}"
                                formnovalidate th:text="#{pago.recalcular}">Recalcular</button>
                    </div>
                </div>
            </div>

            <!--/* Resultado del calculo: el monto que se va a pagar y de donde sale. */-->
            <div th:if="${quote != null}" class="ledger">
                <div class="ledger-row" th:if="${quote.periodStart() != null}">
                    <span th:text="#{pago.periodo}">Periodo</span>
                    <span th:text="${@fmt.date(quote.periodStart())} + ' – ' + ${@fmt.date(quote.periodEnd())}">fechas</span>
                </div>
                <div class="ledger-row" th:if="${quote.earnedInPeriod() != null}">
                    <span th:text="#{pago.devengado.periodo}">Devengado en el periodo</span>
                    <span class="money" th:text="${@fmt.money(quote.earnedInPeriod())}">$0</span>
                </div>
                <div class="ledger-row" th:if="${quote.discounted() != null and quote.discounted().signum() > 0}">
                    <span th:text="#{pago.descuento.anticipos}">Menos anticipos ya entregados</span>
                    <span class="money" th:text="'− ' + ${@fmt.money(quote.discounted())}">$0</span>
                </div>
                <div class="ledger-row ledger-total">
                    <span th:text="#{pago.a.pagar}">A pagar</span>
                    <span class="money" th:text="${@fmt.money(quote.amount())}">$0</span>
                </div>
            </div>
            <div th:if="${quoteError != null}" class="error-summary" role="alert">
                <p th:text="${#messages.msgWithParams(quoteError, quoteErrorArgs)}">No se puede pagar.</p>
            </div>

            <!--/* Anticipo: monto y motivo los decide el maestro, con el saldo como tope. */-->
            <th:block th:if="${form.type.name() == 'ADVANCE'}">
                <div class="notice notice-info">
                    <svg th:replace="~{fragments/icons :: info}"></svg>
                    <p th:text="#{pago.anticipo.tope(${@fmt.money(a.balance())})}">Puedes adelantar hasta el saldo.</p>
                </div>
                <div class="form-grid">
                    <div class="wide" th:insert="~{fragments/ui :: money('amount', #{campo.monto}, null)}"></div>
                    <div class="wide" th:insert="~{fragments/ui :: input('reason', #{campo.motivo.anticipo}, 'text', #{campo.motivo.anticipo.pista})}"></div>
                    <div class="wide field">
                        <label class="check"><input type="checkbox" th:field="*{requestedByWorker}"><span th:text="#{campo.pedido.trabajador}">Lo pidió el trabajador</span></label>
                    </div>
                </div>
            </th:block>

            <div class="form-grid" th:if="${quoteError == null}">
                <div class="field" th:classappend="${#fields.hasErrors('method')} ? 'field-invalid'">
                    <label for="method" th:text="#{campo.medio.pago}">Medio de pago</label>
                    <select th:field="*{method}" data-payment-method>
                        <option th:each="m : ${paymentMethods}" th:value="${m}" th:text="#{${'medio.' + m}}">Efectivo</option>
                    </select>
                </div>
                <div class="field" data-payment-reference th:classappend="${#fields.hasErrors('referencePresentWhenRequired')} ? 'field-invalid'">
                    <label for="transactionReference" th:text="#{campo.referencia}">Número de operación</label>
                    <input type="text" th:field="*{transactionReference}" maxlength="40">
                    <p class="field-error" th:if="${#fields.hasErrors('referencePresentWhenRequired')}" th:errors="*{referencePresentWhenRequired}"></p>
                </div>
            </div>
        </div>
        <div class="panel-foot split">
            <a class="btn btn-quiet" th:href="@{/maestro/asignaciones/{id}(id=${a.id()})}" th:text="#{accion.cancelar}">Cancelar</a>
            <button class="btn btn-primary" type="submit" th:if="${quoteError == null}"
                    th:text="${quote != null} ? #{pago.registrar.monto(${@fmt.money(quote.amount())})} : #{pago.registrar}">Registrar pago</button>
        </div>
    </form>
</th:block>
</body>
</html>
