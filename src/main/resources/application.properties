# ============================================================================
# Configuracion comun a todos los perfiles. Lo que cambia por ambiente vive en
# application-dev.properties y application-prod.properties.
# Patron ${VARIABLE:valor} = se lee la variable de entorno y, si no existe,
# se usa el valor por defecto (solo los perfiles sin secretos reales tienen defecto).
# ============================================================================
spring.application.name=jornal
spring.profiles.default=dev

server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------- JPA
# Hibernate valida el esquema que crea Flyway; nunca lo modifica.
spring.jpa.hibernate.ddl-auto=validate
# Sin Open Session In View: las vistas reciben DTO armados dentro de la transaccion.
spring.jpa.open-in-view=false
# Carga perezosa por lotes (consultas IN) para evitar el problema N+1.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------- mensajes e idioma
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=es_CO
spring.web.locale-resolver=fixed
spring.jackson.time-zone=America/Bogota
spring.mvc.format.date=iso
spring.mvc.format.time=HH:mm
spring.thymeleaf.cache=true

# ---------------------------------------------------------------- aplicacion
app.timezone=America/Bogota

# Seguridad (OWASP A02/A07). El secreto JWT NO tiene valor por defecto aqui:
# cada perfil lo define o la aplicacion no arranca.
app.security.jwt-expiration=1h
app.security.max-login-attempts=5
app.security.lock-duration=15m
app.security.bcrypt-strength=12

# Origenes que pueden llamar la API desde un navegador (separados por coma). Vacio = ninguno.
app.cors.allowed-origins=${CORS_ORIGINS:}

# Parametros laborales (Colombia, 2026)
# SMMLV 2026: $1.750.905. Jornada maxima de 42 h semanales desde el 15 de julio de 2026
# (Ley 2101 de 2021) -> 42 / 6 x 30 = 210 horas ordinarias al mes.
app.labor.minimum-monthly-wage=1750905
app.labor.monthly-hours=210

# ---------------------------------------------------------------- actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Jornal
info.app.description=Contratacion de ayudantes de obra por dias
info.app.version=@project.version@
info.app.java=@java.version@

# ---------------------------------------------------------------- OpenAPI (solo dev lo activa)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/**
