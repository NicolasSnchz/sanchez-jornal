# ============================================================================
# Perfil prod: PostgreSQL y todos los secretos desde variables de entorno.
# Sin valores por defecto para secretos: si falta uno, la aplicacion no arranca
# (es preferible fallar al iniciar que correr con una clave conocida).
# ============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

app.security.jwt-secret=${JWT_SECRET}
app.seed.enabled=false

server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.forward-headers-strategy=framework

# Solo salud e informacion; nunca env, beans ni configprops (exponen secretos).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.jornal=INFO
