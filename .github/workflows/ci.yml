# Integracion continua: en cada push y pull request a main se compila, se corren
# todas las pruebas con cobertura minima y se verifica que la imagen Docker
# arranque y responda sana. Si algo falla, el cambio no se integra.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pruebas y cobertura (JaCoCo >= 70 %)
        run: mvn -B verify

      - name: Reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: |
            target/surefire-reports/
            target/site/jacoco/

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t jornal:ci .

      - name: Prueba de humo (PostgreSQL + aplicacion)
        env:
          JWT_SECRET: secreto-solo-para-la-prueba-de-humo-de-ci-2026
        run: |
          docker network create jornal-ci
          docker run -d --name db --network jornal-ci \
            -e POSTGRES_DB=jornal -e POSTGRES_USER=jornal -e POSTGRES_PASSWORD=jornal postgres:16-alpine
          for i in $(seq 1 20); do docker exec db pg_isready -U jornal && break; sleep 2; done
          docker run -d --name app --network jornal-ci -p 8080:8080 \
            -e DB_URL=jdbc:postgresql://db:5432/jornal -e DB_USERNAME=jornal -e DB_PASSWORD=jornal \
            -e JWT_SECRET="$JWT_SECRET" -e COOKIE_SECURE=false jornal:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Aplicacion sana"; exit 0
            fi
            sleep 3
          done
          docker logs app
          exit 1

      - name: Limpieza
        if: always()
        run: docker rm -f app db || true
