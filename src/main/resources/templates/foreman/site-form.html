<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${siteId == null} ? #{obra.nueva} : #{obra.editar}, ~{::view}, 'page page-narrow')}">
<body>
<th:block th:fragment="view">
    <div class="page-head">
        <div>
            <div class="crumbs">
                <a th:href="@{/maestro/obras}" th:text="#{titulo.obras}">Obras</a>
                <th:block th:if="${siteId != null}"><span aria-hidden="true">/</span>
                    <a th:href="@{/maestro/obras/{id}(id=${siteId})}" th:text="*{name}" th:object="${form}">Obra</a></th:block>
            </div>
            <h1 th:text="${siteId == null} ? #{obra.nueva} : #{obra.editar}">Nueva obra</h1>
            <p class="lede" th:text="#{obra.form.lede}">Texto</p>
        </div>
    </div>

    <form class="panel" th:object="${form}" method="post" novalidate
          th:action="${siteId == null} ? @{/maestro/obras} : @{/maestro/obras/{id}(id=${siteId})}">
        <div class="panel-body form">
            <div th:replace="~{fragments/ui :: globalErrors}"></div>
            <div class="form-grid">
                <div class="wide" th:insert="~{fragments/ui :: input('name', #{campo.obra.nombre}, 'text', #{campo.obra.nombre.pista})}"></div>
                <div class="wide field" th:classappend="${#fields.hasErrors('description')} ? 'field-invalid'">
                    <label for="description" th:text="#{campo.obra.descripcion}">Descripción</label>
                    <textarea th:field="*{description}" rows="3"></textarea>
                    <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
                </div>
                <div class="wide" th:insert="~{fragments/ui :: input('address', #{campo.direccion}, 'text', null)}"></div>
                <div th:replace="~{fragments/ui :: input('neighborhood', #{campo.barrio}, 'text', null)}"></div>
                <div th:replace="~{fragments/ui :: input('city', #{campo.ciudad}, 'text', null)}"></div>
                <div th:replace="~{fragments/ui :: input('startDate', #{campo.obra.inicio}, 'date', null)}"></div>
                <div th:replace="~{fragments/ui :: input('estimatedEndDate', #{campo.obra.fin}, 'date', #{campo.obra.fin.pista})}"></div>
                <div class="wide" th:insert="~{fragments/ui :: input('buildingPermit', #{campo.licencia}, 'text', #{campo.licencia.pista})}"></div>
            </div>
        </div>
        <div class="panel-foot split">
            <a class="btn btn-quiet" th:href="${siteId == null} ? @{/maestro/obras} : @{/maestro/obras/{id}(id=${siteId})}" th:text="#{accion.cancelar}">Cancelar</a>
            <button class="btn btn-primary" type="submit" th:text="${siteId == null} ? #{obra.crear} : #{accion.guardar}">Crear obra</button>
        </div>
    </form>
</th:block>
</body>
</html>
