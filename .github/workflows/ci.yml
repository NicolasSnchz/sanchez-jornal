# CI/CD: en cada push y pull request a main
#   1. compila y corre todas las pruebas con cobertura minima, en Java 17 y en Java 21;
#   2. levanta la aplicacion con docker compose (PostgreSQL + perfiles prod y demo),
#      revisa que responda sana y corre la coleccion de Postman contra ella;
#   3. solo en main y si todo lo anterior paso: publica la imagen en GitHub Packages (ghcr.io).
# Si algo falla, el cambio no se integra ni se publica, y el resumen de la ejecucion muestra por que.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Pruebas (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v5

      - name: JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Pruebas y cobertura (JaCoCo >= 70 %)
        run: mvn -B verify

      - name: Resumen de pruebas y cobertura
        if: always()
        run: |
          if ls target/surefire-reports/TEST-*.xml > /dev/null 2>&1; then
            total=$(cat target/surefire-reports/TEST-*.xml | grep -c '<testcase ' || true)
            fallas=$(cat target/surefire-reports/TEST-*.xml | grep -c '<failure\|<error ' || true)
            echo "**Java ${{ matrix.java }}:** $total pruebas, $fallas con falla o error" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
              END { printf "Cobertura de lineas: %.1f %%, de ramas: %.1f %%\n", 100 * lc / (lm + lc), 100 * bc / (bm + bc) }' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/site/jacoco/

  docker:
    name: Docker compose y Postman
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Levantar con docker compose (igual que en el README)
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Prueba de humo
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then break; fi
            sleep 3
          done
          curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          # Login con un usuario de demostracion: prueba PostgreSQL, Flyway y los datos de ejemplo.
          curl -fsS -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"maestro@jornal.co","password":"Jornal2026*"}' | grep -q accessToken
          # Sin token la API responde 401.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/obras)" = "401"
          echo "Aplicacion sana en Docker con PostgreSQL" >> "$GITHUB_STEP_SUMMARY"

      - name: Coleccion de Postman con Newman
        run: npx --yes newman@6 run postman/jornal.postman_collection.json -e postman/jornal-local.postman_environment.json

      - name: Logs de la aplicacion si algo falla
        if: failure()
        run: |
          { echo '### Logs de la aplicacion'; echo '```'; docker compose logs --no-color app | tail -n 120; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          docker compose logs --no-color

      - name: Limpieza
        if: always()
        run: docker compose down -v

  publish:
    name: Publicar imagen (ghcr.io)
    runs-on: ubuntu-24.04
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Construir y publicar
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push --all-tags "$IMAGE"
          echo "Imagen publicada: \`$IMAGE:${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
