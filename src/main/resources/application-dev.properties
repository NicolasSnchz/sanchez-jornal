# ============================================================================
# Perfil dev: H2 en memoria (modo PostgreSQL), datos de demostracion, Swagger UI
# y logs detallados. Se activa por defecto (spring.profiles.default=dev).
# ============================================================================
spring.datasource.url=jdbc:h2:mem:jornal;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.thymeleaf.cache=false

# Secreto solo para desarrollo (>= 256 bits). En produccion se exige JWT_SECRET.
app.security.jwt-secret=${JWT_SECRET:dev-solo-para-desarrollo-cambiar-en-produccion-jornal-2026}
# BCrypt mas liviano en dev para que las pruebas y el arranque sean rapidos.
app.security.bcrypt-strength=10
app.seed.enabled=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

management.endpoints.web.exposure.include=health,info,metrics,flyway,mappings
management.endpoint.health.show-details=always

logging.level.com.jornal=DEBUG
logging.level.org.springframework.security=INFO
